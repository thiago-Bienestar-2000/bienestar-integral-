<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de administración — Bienestar Integral</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="admin-body">

<div class="admin-wrap">
  <div class="admin-brand">
    <img src="images/logo.png" alt="Bienestar Integral">
    <span>Panel de administración</span>
  </div>

  <!-- LOGIN -->
  <div id="loginBox" class="admin-card">
    <h2>Ingresar</h2>
    <form id="loginForm">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" autocomplete="username" required>
      <label for="loginPass">Contraseña</label>
      <input type="password" id="loginPass" autocomplete="current-password" required>
      <button type="submit" class="btn btn-primary" id="loginBtn">Ingresar</button>
      <p class="testi-msg" id="loginMsg"></p>
    </form>
  </div>

  <!-- PANEL -->
  <div id="panelBox" class="admin-panel" hidden>
    <div class="admin-top">
      <p>Sesión iniciada como <strong id="adminEmail"></strong></p>
      <button class="btn btn-outline" id="logoutBtn">Cerrar sesión</button>
    </div>

    <h2>Pendientes de aprobación</h2>
    <div id="pendientesList" class="admin-list"></div>
    <p id="pendientesVacio" class="admin-empty" hidden>No hay testimonios pendientes.</p>

    <h2>Publicados</h2>
    <div id="aprobadosList" class="admin-list"></div>
    <p id="aprobadosVacio" class="admin-empty" hidden>Todavía no hay testimonios publicados.</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
